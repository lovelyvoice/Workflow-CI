name: Workflow CI - Iris SVM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MLflow
        run: |
          pip install mlflow==2.9.2 scikit-learn==1.5.2 pandas numpy matplotlib seaborn

      - name: Train model via MLflow Project
        run: |
          mlflow run MLProject/ --env-manager=local
        env:
          MLFLOW_TRACKING_URI: file:${{ github.workspace }}/mlruns

      - name: Upload artefak ke GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            outputs/
            mlruns/

      - name: Commit artefak ke repo
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add mlruns/ || true
          git add outputs/ || true
          git diff --staged --quiet || git commit -m "Auto: update model artifacts [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get latest Run ID
        id: get_run_id
        run: |
          RUN_ID=$(ls mlruns/0/ | grep -v meta | head -1)
          echo "RUN_ID=${RUN_ID}" >> $GITHUB_OUTPUT

      - name: Build Docker Image dengan mlflow
        run: |
          mlflow models build-docker \
            --model-uri "mlruns/0/${{ steps.get_run_id.outputs.RUN_ID }}/artifacts/svm_model" \
            --name "${{ secrets.DOCKER_USERNAME }}/iris-svm-model"

      - name: Push Docker Image ke Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/iris-svm-model:latest